name: Smoke Test

on:
  workflow_dispatch:
    inputs:
      keep_stack:
        description: "Leave the compose stack running after tests (for debugging)"
        type: boolean
        default: false
  # Runs on EVERY pull request, deliberately unfiltered by path.
  #
  # This suite hard-codes selectors that live in cms/templates and
  # cms/static, so a PR that only touches the UI can break it. It used to
  # be filtered to `tests/nightly/**`, which meant exactly that class of
  # change skipped it -- #876 went green on 21/21 checks and then broke
  # main, needing a repair PR (#877). See #880.
  #
  # A path filter is also unsafe now that this is a required check: a
  # skipped required check never reports and the PR waits forever.
  #
  # Cost is nil in practice -- this job takes ~5 min against ~9.5 min for
  # the Tests workflow, so it is never the long pole.
  pull_request:
    branches: [main]
  # Runs on every main push so it can serve as the pre-deploy gate
  # (Publish & Deploy is triggered off a successful Smoke Test run).
  push:
    branches: [main]

# Pushes to main share one queue so the deploy gate stays strictly
# ordered. Pull requests get a queue each, and a new push to a PR
# supersedes its own in-flight run.
concurrency:
  group: nightly-e2e-${{ github.event_name == 'push' && 'main' || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  nightly-e2e:
    name: Full compose stack E2E
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Check out agora-cms
        uses: actions/checkout@v4
        with:
          path: agora-cms

      - name: Check out agora-device-simulator (sibling repo)
        uses: actions/checkout@v4
        with:
          repository: sslivins/agora-device-simulator
          path: agora-device-simulator
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: |
            agora-cms/requirements-test.txt
            agora-cms/requirements.txt

      - name: Install test dependencies
        working-directory: agora-cms
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-test.txt
          pip install httpx playwright pytest pillow pillow-heif imageio-ffmpeg
          python -m playwright install --with-deps chromium

      - name: Docker version info
        run: |
          docker --version
          docker compose version

      - name: Run nightly E2E
        working-directory: agora-cms
        env:
          NIGHTLY: "1"
          NIGHTLY_KEEP_STACK: ${{ inputs.keep_stack == true && '1' || '' }}
          NIGHTLY_STARTUP_TIMEOUT: "360"
        run: |
          mkdir -p tests/nightly/coverage-data
          pytest tests/nightly -v --tb=short -o log_cli=true -o log_cli_level=INFO

      - name: Combine nightly coverage
        if: always()
        working-directory: agora-cms
        run: |
          set -e
          python -m pip install --quiet 'coverage<8'
          if compgen -G "tests/nightly/coverage-data/.coverage*" > /dev/null; then
            cat > .coveragerc.combine <<'EOF'
          [paths]
          source =
              .
              /app
          [run]
          branch = false
          source = cms,shared
          EOF
            COVERAGE_RCFILE=.coveragerc.combine coverage combine tests/nightly/coverage-data/ || true
            COVERAGE_RCFILE=.coveragerc.combine coverage xml -o nightly-coverage.xml || true
            COVERAGE_RCFILE=.coveragerc.combine coverage report --skip-covered | tail -40 >> "$GITHUB_STEP_SUMMARY" || true
          else
            echo "::warning::no nightly coverage data produced (did CMS shut down cleanly?)"
          fi

      - name: Upload nightly coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-coverage
          path: |
            agora-cms/nightly-coverage.xml
            agora-cms/tests/nightly/coverage-data/
          if-no-files-found: ignore
          retention-days: 14

      - name: Capture compose logs on failure
        if: failure()
        working-directory: agora-cms
        run: |
          docker compose -p agora-nightly \
            -f docker-compose.yml \
            -f tests/nightly/docker-compose.nightly.yml \
            logs --no-color --tail=2000 > compose-logs-on-failure.txt || true
          docker compose -p agora-nightly \
            -f docker-compose.yml \
            -f tests/nightly/docker-compose.nightly.yml \
            ps >> compose-logs-on-failure.txt || true

      - name: Upload logs artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nightly-e2e-logs
          path: |
            agora-cms/tests/nightly/last-run-logs.txt
            agora-cms/compose-logs-on-failure.txt
          if-no-files-found: ignore
          retention-days: 14

      - name: Job summary
        if: always()
        working-directory: agora-cms
        run: |
          {
            echo "## Nightly E2E result: ${{ job.status }}"
            echo ""
            echo "- Run: [${{ github.run_id }}](${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }})"
            echo "- Triggered by: ${{ github.event_name }}"
            echo ""
            if [ -f tests/nightly/last-run-logs.txt ]; then
              echo "Compose logs captured in artifact \`nightly-e2e-logs\` (\`last-run-logs.txt\`)."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
